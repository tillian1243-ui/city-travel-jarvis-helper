name: MCP and legacy regression tests
on:
  pull_request:
  push:
    branches: [main, codex/mcp-plugin-connection]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: city-travel-jarvis-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

